<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- FinallyMigrate 应用图标（设计源文件，assets/icon.ico / icon.png 由 tools/genicon 按同一几何程序化生成） -->
  <!-- 与 finallyshell 官方图标同族：深色圆角方块 + 左侧栏连接卡片；区分点：青绿侧栏、钥匙主体、迁移箭头 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3035"/><stop offset="1" stop-color="#1a1c1f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="250" height="824" fill="url(#side)"/>
    <rect x="150" y="300" width="150" height="78" rx="22" fill="#fff"/>
    <circle cx="186" cy="339" r="14" fill="#22c55e"/>
    <rect x="212" y="330" width="66" height="18" rx="9" fill="#5eead4"/>
    <rect x="150" y="420" width="150" height="78" rx="22" fill="#fff" fill-opacity=".18"/>
    <rect x="150" y="540" width="150" height="78" rx="22" fill="#fff" fill-opacity=".18"/>
  </g>
  <!-- 钥匙（凭据）：环 + 柄 + 两齿，圆头粗线条 -->
  <circle cx="475" cy="450" r="80" fill="none" stroke="#e5e7eb" stroke-width="56"/>
  <path d="M555 450 L795 450" stroke="#e5e7eb" stroke-width="56" stroke-linecap="round"/>
  <path d="M690 450 L690 530" stroke="#e5e7eb" stroke-width="56" stroke-linecap="round"/>
  <path d="M765 450 L765 530" stroke="#e5e7eb" stroke-width="56" stroke-linecap="round"/>
  <!-- 迁移箭头：青绿胶囊 + 箭尖 -->
  <rect x="610" y="574" width="180" height="56" rx="28" fill="#0d9488"/>
  <path d="M775 556 L775 648 L835 602 Z" fill="#0d9488"/>
</svg>
